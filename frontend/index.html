<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Crevo Menu</title>
    <script>
      window.__crevoBootErrors = [];
      window.addEventListener('error', function (event) {
        try {
          window.__crevoBootErrors.push(event?.error?.message || event?.message || String(event));
        } catch (_) {}
      });
      window.addEventListener('unhandledrejection', function (event) {
        try {
          window.__crevoBootErrors.push(event?.reason?.message || String(event?.reason || event));
        } catch (_) {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
