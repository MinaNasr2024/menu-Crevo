services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crevo_menu
      MYSQL_USER: crevo
      MYSQL_PASSWORD: crevo
    ports:
      - "3306:3306"
    volumes:
      - crevo_mydata:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  crevo_mydata:
